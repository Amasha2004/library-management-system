<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found | LibraryMS</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap');

        * { box-sizing:border-box; margin:0; padding:0; }
        body {
            font-family:'DM Sans',sans-serif;
            background:#f0f2f5;
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            position:relative;
            overflow:hidden;
        }

        /* Background decoration */
        .bg-circle {
            position:fixed; border-radius:50%;
            background:linear-gradient(135deg,#6366f1,#8b5cf6);
            opacity:0.06; animation:float 6s ease-in-out infinite;
        }
        .bc1 { width:400px; height:400px; top:-100px; right:-100px; animation-delay:0s; }
        .bc2 { width:300px; height:300px; bottom:-80px; left:-80px; animation-delay:2s; }
        .bc3 { width:200px; height:200px; top:50%; left:60%; animation-delay:4s; }
        @keyframes float {
            0%,100% { transform:translateY(0) scale(1); }
            50% { transform:translateY(-20px) scale(1.05); }
        }

        /* Main card */
        .error-card {
            background:#fff; border-radius:24px;
            padding:60px 48px; text-align:center;
            box-shadow:0 8px 40px rgba(0,0,0,0.1);
            max-width:500px; width:90%;
            position:relative; z-index:1;
            animation:fadeUp 0.6s ease both;
        }
        @keyframes fadeUp {
            from { opacity:0; transform:translateY(30px); }
            to { opacity:1; transform:translateY(0); }
        }

        /* 404 number */
        .error-number {
            font-family:'Playfair Display',serif;
            font-size:100px; font-weight:700; line-height:1;
            background:linear-gradient(135deg,#6366f1,#8b5cf6);
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
            background-clip:text;
            margin-bottom:8px;
            animation:pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%,100% { transform:scale(1); }
            50% { transform:scale(1.03); }
        }

        /* Book icon */
        .error-icon {
            font-size:48px; margin-bottom:16px;
            display:block; animation:bounce 2s ease-in-out infinite;
        }
        @keyframes bounce {
            0%,100% { transform:translateY(0); }
            50% { transform:translateY(-8px); }
        }

        .error-title {
            font-family:'Playfair Display',serif;
            font-size:26px; font-weight:700; color:#1a1a2e;
            margin-bottom:12px;
        }
        .error-sub {
            font-size:15px; color:#888; line-height:1.7;
            margin-bottom:32px;
        }

        /* Buttons */
        .error-actions { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
        .btn-home {
            display:inline-flex; align-items:center; gap:8px;
            padding:12px 28px; border-radius:12px;
            background:linear-gradient(135deg,#6366f1,#8b5cf6);
            color:#fff; text-decoration:none;
            font-size:14px; font-weight:600;
            transition:all 0.2s;
            box-shadow:0 4px 14px rgba(99,102,241,0.4);
        }
        .btn-home:hover { opacity:0.9; transform:translateY(-2px); color:#fff; }
        .btn-back {
            display:inline-flex; align-items:center; gap:8px;
            padding:12px 28px; border-radius:12px;
            background:#f5f5f5; color:#666;
            border:1.5px solid #e0e0e0;
            text-decoration:none; font-size:14px; font-weight:600;
            transition:all 0.2s;
        }
        .btn-back:hover { background:#e0e0e0; color:#333; }

        /* Brand */
        .brand {
            display:flex; align-items:center; justify-content:center;
            gap:8px; margin-bottom:32px;
        }
        .brand-icon {
            width:36px; height:36px;
            background:linear-gradient(135deg,#6366f1,#8b5cf6);
            border-radius:10px; display:flex; align-items:center;
            justify-content:center; color:#fff; font-size:18px;
        }
        .brand-name {
            font-family:'Playfair Display',serif;
            font-size:18px; font-weight:700; color:#1a1a2e;
        }

        /* Divider */
        .divider {
            width:60px; height:3px; border-radius:2px;
            background:linear-gradient(90deg,#6366f1,#8b5cf6);
            margin:0 auto 20px;
        }
    </style>
</head>
<body>
    <div class="bg-circle bc1"></div>
    <div class="bg-circle bc2"></div>
    <div class="bg-circle bc3"></div>

    <div class="error-card">
        <div class="brand">
            <div class="brand-icon"><i class="bi bi-book-half"></i></div>
            <span class="brand-name">LibraryMS</span>
        </div>

        <span class="error-icon">📚</span>
        <div class="error-number">404</div>
        <div class="divider"></div>
        <div class="error-title">Page Not Found</div>
        <div class="error-sub">
            Oops! The page you're looking for seems to have gone missing
            from our shelves. It may have been moved or doesn't exist.
        </div>

        <div class="error-actions">
            <a href="/" class="btn-home">
                <i class="bi bi-house"></i> Go Home
            </a>
            <a href="javascript:history.back()" class="btn-back">
                <i class="bi bi-arrow-left"></i> Go Back
            </a>
        </div>
    </div>
</body>
</html>
